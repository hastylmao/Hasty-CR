<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="HastyCR — a deterministic Clash Royale simulator and reinforcement-learning agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#131c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7dd3fc" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="14" fill="url(#grid)"/>

  <!-- arena motif: two lanes, a river, four towers -->
  <g transform="translate(880 40)">
    <rect x="0" y="0" width="270" height="260" rx="10" fill="#0a0f1e" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="122" width="270" height="16" fill="url(#riverGrad)"/>
    <line x1="62" y1="122" x2="62" y2="138" stroke="#94a3b8" stroke-opacity=".5" stroke-width="10"/>
    <line x1="208" y1="122" x2="208" y2="138" stroke="#94a3b8" stroke-opacity=".5" stroke-width="10"/>
    <g fill="#1e293b" stroke="#334155" stroke-width="1.5">
      <rect x="38" y="36" width="34" height="34" rx="5"/>
      <rect x="198" y="36" width="34" height="34" rx="5"/>
      <rect x="38" y="190" width="34" height="34" rx="5"/>
      <rect x="198" y="190" width="34" height="34" rx="5"/>
    </g>
    <rect x="118" y="16" width="34" height="30" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="118" y="214" width="34" height="30" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- a push, mid lane -->
    <circle cx="215" cy="160" r="6" fill="#60a5fa"/>
    <circle cx="215" cy="178" r="4.5" fill="#38bdf8" fill-opacity=".75"/>
    <circle cx="200" cy="110" r="5" fill="#f87171" fill-opacity=".85"/>
    <path d="M215 152 L 212 96" stroke="#60a5fa" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="4 5"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(72 108)">
    <text x="0" y="0" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#f1f5f9" letter-spacing="-1.5">HastyCR</text>
    <rect x="2" y="20" width="132" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="66" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#94a3b8">A deterministic Clash Royale simulator, and an agent</text>
    <text x="0" y="98" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#94a3b8">that learns to play 2.6 Hog Cycle inside it.</text>
  </g>

  <!-- stat chips -->
  <g transform="translate(72 258)" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="14">
    <g>
      <rect x="0" y="0" width="176" height="34" rx="8" fill="#111a2e" stroke="#243049"/>
      <text x="16" y="22" fill="#7dd3fc">50 ms</text><text x="72" y="22" fill="#64748b">integer tick</text>
    </g>
    <g transform="translate(190 0)">
      <rect x="0" y="0" width="168" height="34" rx="8" fill="#111a2e" stroke="#243049"/>
      <text x="16" y="22" fill="#7dd3fc">1,614</text><text x="66" y="22" fill="#64748b">tests</text>
    </g>
    <g transform="translate(374 0)">
      <rect x="0" y="0" width="212" height="34" rx="8" fill="#111a2e" stroke="#243049"/>
      <text x="16" y="22" fill="#7dd3fc">18% → 93%</text><text x="106" y="22" fill="#64748b">after the fix</text>
    </g>
  </g>
</svg>
