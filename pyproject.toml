[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hastycr"
version = "0.1.0"
description = "A deterministic Clash Royale simulator and reinforcement-learning agent"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"

# Enough to run the simulator, the trainer and the whole test suite. Declaring
# nothing meant `pip install -e .` installed no dependencies at all, so a fresh
# clone followed the README and then died on `import numpy`.
dependencies = [
    "numpy>=1.26",
    "torch>=2.6",
]

[project.optional-dependencies]
# Playing the real game: perception, the emulator bridge and the studio UI.
# Kept separate because none of it is needed to run the simulator or the tests.
live = [
    "opencv-python>=4.8",
    "pillow>=10.0",
    "psutil>=5.9",
    "PyQt6>=6.6",
    "ultralytics>=8.3",
    "av>=12.0",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

